<meta charset="utf-8">
<title>Óscar Ramón Mendiguchía · Ingeniero de producto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,100,400&display=swap">
<style>
/* Lámina de taller: papel de plano frío, tinta casi negra y un naranja de señal.
   Una sola familia (Archivo) que va de texto normal a ancho extendido para los titulares. */
:root{
  --paper:#ECEDEE; --paper-2:#E1E3E5; --ink:#0B0C0D; --ink-2:#4E545B; --night:#0B0C0D; --night-2:#16181B; --on-night:#EEEFF0; --on-night-2:#9EA5AD;
  --signal:#FF4D1A; --white:#FFFFFF;
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --gut:max(20px,env(safe-area-inset-left,0px));
  --e-out:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-stretch:100%}
img{max-width:100%;display:block;height:auto}
a{color:inherit}
p,h1,h2,h3,figure{margin:0}
:focus-visible{outline:3px solid var(--signal);outline-offset:4px}
::selection{background:var(--signal);color:var(--ink)}
.wrap{max-width:1600px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.wrap{padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}}
.wide{font-stretch:125%;font-weight:800;letter-spacing:-.045em;line-height:.86;text-transform:uppercase;min-width:0;max-width:100%}
.mask{display:block;overflow:hidden;padding-top:.16em;margin-top:-.16em;padding-bottom:.06em;margin-bottom:-.06em}
.mask>span{display:block;will-change:transform}
.fit,.fill{white-space:nowrap}

/* Cabecera */
.hd{position:fixed;left:0;right:0;top:0;z-index:30;mix-blend-mode:difference;color:#fff;pointer-events:none}
.hd .in{display:flex;align-items:center;justify-content:space-between;height:84px;padding-top:env(safe-area-inset-top,0px)}
.hd a{pointer-events:auto;text-decoration:none}
.hd .wm{font-weight:700;font-size:17px;letter-spacing:-.01em}
.hd nav{display:flex;gap:28px;align-items:center}
.hd nav a{font-size:16px;font-weight:500;position:relative;padding:12px 2px}
.hd nav a::after{content:"";position:absolute;left:2px;right:2px;bottom:6px;height:2px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .5s var(--e-out)}
.hd nav a:hover::after{transform:scaleX(1);transform-origin:left}
@media(max-width:700px){.hd nav .opt{display:none}}

/* Botón */
.btn{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 28px;border-radius:999px;background:var(--ink);color:var(--paper);text-decoration:none;font-weight:600;font-size:16px;position:relative;overflow:hidden;isolation:isolate;transition:color .45s var(--e-out)}
.btn::before{content:"";position:absolute;inset:0;background:var(--signal);transform:translateY(101%);border-radius:inherit;transition:transform .55s var(--e-out);z-index:-1}
.btn:hover{color:var(--ink)}
.btn:hover::before{transform:none}
.btn .ar{display:inline-block;transition:transform .45s var(--e-out)}
.btn:hover .ar{transform:translateX(5px)}
.btn.inv{background:var(--paper);color:var(--ink)}

/* Cortinilla de cambio de página */
.veil{position:fixed;inset:0;z-index:60;background:var(--signal);transform:translateY(100%);pointer-events:none;display:flex;align-items:flex-end}
.veil span{font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.045em;font-size:clamp(48px,9vw,150px);line-height:.85;padding:0 var(--gut) 40px;color:var(--ink)}

/* ---------- PORTADA ---------- */
.hero{height:100svh;position:relative;overflow:hidden;background:var(--paper)}
.hero .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding-top:60px}
.hero h1{line-height:.84;position:relative;will-change:transform}
.hero h1 .l2{text-align:right}
.hero .ch{display:inline-block;will-change:transform}
.hero .cue{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));width:1px;height:64px;background:rgba(11,12,13,.18);overflow:hidden}
.hero .cue::after{content:"";position:absolute;left:0;top:0;width:1px;height:40%;background:var(--ink);animation:cue 1.8s var(--e-out) infinite}
@keyframes cue{0%{transform:translateY(-100%)}100%{transform:translateY(260%)}}
.hero .shade{position:absolute;inset:0;background:var(--night);opacity:0;pointer-events:none}

/* Proceso fijado */
.proc{background:var(--night);color:var(--on-night)}
.pstage{height:100svh;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:center}
.pwords{position:relative;z-index:2;display:flex;flex-direction:column;gap:28px}
.pwin{height:calc(min(5.4vw,104px) * .9);overflow:hidden;position:relative}
.preel{will-change:transform}
.preel div{font-size:min(5.4vw,104px);height:calc(min(5.4vw,104px) * .9);display:flex;align-items:flex-end}
.pdesc{position:relative;min-height:5.2em;max-width:440px}
.pdesc p{position:absolute;inset:0 auto auto 0;font-size:clamp(18px,1.5vw,21px);color:var(--on-night)}
.pdesc p span{display:block;color:var(--on-night-2);font-size:16px;margin-top:10px}
.pmedia{position:relative;height:min(78svh,820px)}
.layer{position:absolute;inset:0;will-change:clip-path;overflow:hidden}
.layer .it{position:absolute;overflow:hidden;background:var(--white);will-change:transform}
.layer .it img{width:100%;height:100%;object-fit:contain;padding:4%}
.layer .it.ph{background:var(--night-2)}
.layer .it.ph img{object-fit:cover;padding:0}
.layer .cap{position:absolute;left:0;bottom:-34px;font-size:15px;color:var(--on-night-2)}
.layer model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent}
.ph1{left:0;top:4%;width:56%;height:52%}.ph2{right:0;top:0;width:40%;height:38%}.ph3{right:4%;bottom:4%;width:52%;height:46%}.ph4{left:6%;bottom:0;width:36%;height:34%}
.pl1{left:0;top:0;width:62%;height:64%}.pl2{right:0;top:12%;width:44%;height:40%}.pl3{right:10%;bottom:0;width:50%;height:42%}
.pk1{left:0;top:0;width:48%;height:58%}.pk2{right:0;top:8%;width:46%;height:42%}.pk3{left:20%;bottom:0;width:62%;height:36%}

/* Piezas en 3D: cada modelo ocupa la pantalla entera y se mueve con el scroll */
.pz{background:var(--paper);color:var(--ink)}
.pzs{position:relative;height:100svh;overflow:hidden}
.pzi{position:absolute;inset:0}
.pzi model-viewer{position:absolute;inset:0;width:100%;height:100%;background:transparent;--poster-color:transparent;pointer-events:none;z-index:2;will-change:transform}
.pzi .nmw{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:1;pointer-events:none}
.pzi .nmw .nm{font-size:min(12vw,220px);line-height:.84;color:var(--ink)}
.pzi .nmw .nm .ch{display:inline-block;will-change:transform}
.pzi .idx{position:absolute;top:104px;left:0;right:0;z-index:3;display:flex;justify-content:space-between;font-size:15px;color:var(--ink-2);pointer-events:none;font-variant-numeric:tabular-nums}
.pzt{position:absolute;left:0;right:0;bottom:max(32px,env(safe-area-inset-bottom,0px));z-index:3;pointer-events:none}
.pzt .row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 40px;flex-wrap:wrap}
.pzt .row p{max-width:520px;font-size:clamp(17px,1.4vw,20px)}
.pzt a{pointer-events:auto}
html.rm .pzs{height:auto}html.rm .pzi{position:relative;height:90svh}

/* Cifras */
.nums{padding-block:200px 160px;overflow:hidden}
.nums h2{font-size:clamp(46px,6.4vw,112px);max-width:12ch}
.nums .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 48px;align-items:end;margin-bottom:96px}
.nums .top p{max-width:460px}
.rail{display:flex;gap:72px;white-space:nowrap;will-change:transform;padding-left:var(--gut)}
.num{display:flex;flex-direction:column;gap:14px;flex:0 0 auto}
.num b{font-stretch:125%;font-weight:800;letter-spacing:-.05em;font-size:clamp(72px,10vw,190px);line-height:.85}
.num span{font-size:17px;white-space:normal;max-width:300px}
.num em{font-style:normal;color:var(--ink-2)}
.rail .num:nth-child(4n+1) b{color:var(--signal)}

/* Proyectos */
.work{padding-block:120px 160px;position:relative}
.work .top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:56px}
.work h2{font-size:clamp(56px,8.6vw,150px)}
.work .top p{max-width:380px;font-size:17px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px) auto;gap:32px;align-items:center;padding:34px 0;text-decoration:none;position:relative}
.prow+.prow{box-shadow:0 -1px 0 rgba(11,12,13,.14)}
.prow .t{font-stretch:118%;font-weight:750;letter-spacing:-.04em;text-transform:uppercase;font-size:clamp(40px,5.4vw,96px);line-height:.88;transition:transform .7s var(--e-out),color .4s ease}
.prow .d{font-size:16px;color:var(--ink-2);transition:color .4s ease}
.prow .k{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:22px;transform:scale(.6);opacity:0;transition:transform .5s var(--e-out),opacity .4s ease}
.prow:hover .t{color:var(--signal)}
.prow:hover .k{transform:none;opacity:1}
.prow .mi{display:none}
.float{position:fixed;left:0;top:0;width:min(21vw,308px);aspect-ratio:4/3;pointer-events:none;z-index:20;overflow:hidden;opacity:0;transform:translate(-50%,-50%) scale(.6);will-change:transform,opacity}
.float img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease}
.float img.on{opacity:1}
.float img.wh{object-fit:contain;background:#fff;padding:6%}
@media(hover:none),(max-width:899px){
  .float{display:none}
  .prow{grid-template-columns:minmax(0,1fr);gap:14px;padding:28px 0}
  .prow .mi{display:block;aspect-ratio:16/10;overflow:hidden;order:-1}
  .prow .mi img{width:100%;height:100%;object-fit:cover}
  .prow .mi.wh{background:#fff}.prow .mi.wh img{object-fit:contain;padding:6%}
  .prow .k{display:none}
}

/* Índice de proyectos */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px 28px}
.tile{display:flex;flex-direction:column;gap:14px;text-decoration:none;min-width:0}
.ti{display:block;aspect-ratio:4/3;overflow:hidden;background:var(--paper-2)}
.ti img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--e-out)}
.ti.wh{background:var(--white)}.ti.wh img{object-fit:contain;padding:5%}
.tile:hover .ti img{transform:scale(1.05)}
.tn{display:flex;align-items:baseline;gap:14px;min-width:0}
.tn .no{font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tn .t{font-stretch:118%;font-weight:750;letter-spacing:-.035em;text-transform:uppercase;font-size:clamp(24px,2.1vw,34px);line-height:.95;transition:color .3s ease;min-width:0}
.tile:hover .tn .t{color:var(--signal)}
.tile .d{font-size:16px;color:var(--ink-2);max-width:34em}
@media(max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.tiles{grid-template-columns:minmax(0,1fr);gap:44px}}

/* Sobre mí */
.about{background:var(--paper-2);padding-block:200px}
.about .in{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;align-items:end}
.about h2{font-size:clamp(56px,8.6vw,150px);margin-bottom:56px}
.about .say{font-size:clamp(19px,1.65vw,24px);line-height:1.4;font-weight:550;letter-spacing:-.015em;max-width:24em}
.about .say .w{opacity:.14;transition:opacity .15s linear}
.about .side{display:flex;flex-direction:column;gap:28px;padding-top:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools span{background:var(--paper);padding:8px 14px;font-size:16px;border-radius:999px}

/* Cierre */
.end{background:var(--signal);color:var(--ink);padding-block:160px 40px;overflow:hidden}
.end .q{font-size:clamp(30px,3.6vw,56px);line-height:1.08;font-weight:650;letter-spacing:-.03em;max-width:15em}
.end .acts{display:flex;gap:14px;flex-wrap:wrap}
.end .big{font-size:min(10.6vw,200px);margin-top:140px;white-space:nowrap}
.end .legal{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:40px;font-size:15px}

/* ---------- PROYECTO ---------- */
.ph-hero{padding-block:150px 64px}
.ph-hero .back{display:inline-flex;gap:10px;align-items:center;text-decoration:none;font-weight:600;font-size:16px;margin-bottom:56px;min-height:44px}
.ph-hero .back span{transition:transform .45s var(--e-out)}
.ph-hero .back:hover span{transform:translateX(-6px)}
.ph-hero h1{font-size:min(11vw,200px)}
.ph-hero .sub{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 48px;margin-top:48px;align-items:end}
.ph-hero .sub .lead{font-size:clamp(20px,1.9vw,27px);line-height:1.38;font-weight:450;max-width:620px}
.ph-hero .meta{display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--ink-2);justify-self:end;text-align:right}
.pvis{height:100svh;position:relative;overflow:hidden;background:var(--paper-2)}
.pvis.m3{background:var(--paper)}
.pvis model-viewer{position:absolute;inset:0;width:100%;height:100%;background:transparent;--poster-color:transparent;z-index:2}
.pvis .ghost{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);z-index:1;pointer-events:none;color:var(--paper-2);font-size:min(14vw,260px)}
.pvis>img{width:100%;height:118%;object-fit:cover;will-change:transform}
.pvis .hint{position:absolute;left:var(--gut);bottom:24px;font-size:15px;color:var(--ink-2);display:flex;gap:16px;align-items:center;flex-wrap:wrap;z-index:3}
.pvis model-viewer#mvP{pointer-events:none}
.viewer{padding-top:120px}
.viewer .vtop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 40px;flex-wrap:wrap;margin-bottom:32px}
.viewer h2{font-size:clamp(40px,4.6vw,84px)}
.viewer .vtop p{font-size:16px;color:var(--ink-2)}
.vbox{position:relative;background:var(--paper-2)}
.vcomp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.vcomp button{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid rgba(11,12,13,.25);background:transparent;color:var(--ink);font:600 15px var(--f);cursor:pointer;transition:background-color .3s ease,color .3s ease,border-color .3s ease}
.vcomp button:hover{border-color:var(--ink)}
.vcomp button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.vbox model-viewer{display:block;width:100%;height:min(86svh,920px);background:transparent;--poster-color:transparent;cursor:grab}
.vbox model-viewer:active{cursor:grabbing}
.vbtn{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:20px;display:flex;gap:8px}
.vbtn button{min-width:48px;height:48px;padding:0 14px;border-radius:999px;border:0;background:var(--ink);color:var(--paper);font:600 20px/1 var(--f);cursor:pointer;transition:background-color .3s ease,color .3s ease}
.vbtn button.txt{font-size:15px;padding:0 20px}
.vbtn button:hover{background:var(--signal);color:var(--ink)}
.pvis .hint button{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--ink);color:var(--paper);font:600 15px var(--f);cursor:pointer;transition:background-color .3s ease}
.pvis .hint button:hover{background:var(--signal)}
.pvis .hint button:disabled{opacity:.45;cursor:default}
.figs{padding-block:120px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px}
.figs .n{font-stretch:125%;font-weight:800;letter-spacing:-.05em;font-size:clamp(46px,5.2vw,96px);line-height:.88;display:block}
.figs div:first-child .n{color:var(--signal)}
.figs .l{display:block;margin-top:14px;font-size:17px}
.blk{padding-block:120px 0}
.tx2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px 64px;align-items:start}
.tx2 h2{font-size:clamp(40px,4.6vw,84px)}
@media(min-width:900px){.tx2 h2{position:sticky;top:110px}}
.tx2 .body{display:flex;flex-direction:column;gap:20px;max-width:680px}
.tx2 .body>p:first-child{font-size:clamp(20px,1.7vw,24px);line-height:1.45}
.specs{display:grid;gap:24px;margin-top:8px}
.specs b{display:block;font-weight:650}
.fig{display:flex;flex-direction:column;gap:12px}
.fig .bx{overflow:hidden;background:var(--paper-2);cursor:zoom-in;will-change:clip-path}
.fig .bx.wh{background:var(--white)}
.fig .bx img{width:100%;will-change:transform}
.fig figcaption{font-size:15px;color:var(--ink-2)}
.full .bx{display:flex;justify-content:center}
.full .bx img{height:auto;width:auto;max-width:100%;max-height:92svh}
.grid{display:grid;gap:24px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.drawband{background:var(--white);padding-block:110px;margin-top:120px}
.drawband .fig .bx{background:var(--white)}
.drawband + .blk{padding-top:120px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:16px 18px;text-align:left;font-size:17px}
thead th{font-weight:600;color:var(--ink-2);border-bottom:1px solid rgba(11,12,13,.2)}
tbody tr+tr td{border-top:1px solid rgba(11,12,13,.12)}
td:not(:first-child),th:not(:first-child){text-align:right}
.tblw{overflow-x:auto;background:var(--white);padding:10px;border-radius:4px}
.steps{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px 64px;align-items:center}
.steps ol{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:24px}
.steps li{counter-increment:s;display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;align-items:baseline}
.steps li::before{content:counter(s);font-stretch:125%;font-weight:800;font-size:48px;line-height:1;color:var(--signal)}
.nextp{display:block;text-decoration:none;background:var(--night);color:var(--on-night);margin-top:200px;padding-block:120px;overflow:hidden}
.nextp .k{font-size:17px;color:var(--on-night-2)}
.nextp .t{font-size:min(11vw,200px);margin-top:20px;transition:color .4s ease}
.nextp:hover .t{color:var(--signal)}
.nextp .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:40px;align-items:end}
.nextp .im{overflow:hidden;aspect-ratio:4/3}
.nextp .im img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--e-out)}
.nextp:hover .im img{transform:scale(1.07)}
.nextp .im.wh{background:#fff}.nextp .im.wh img{object-fit:contain;padding:6%}

/* Visor */
.lb{position:fixed;inset:0;z-index:70;background:rgba(11,12,13,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lb img{max-height:84vh;width:auto;max-width:100%;object-fit:contain}
.lb p{color:var(--on-night-2);font-size:15px;text-align:center}
.lb button{position:absolute;top:max(18px,env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px))}

@media(max-width:899px){
  .pwin{height:calc(12vw * .9)}.preel div{font-size:12vw;height:calc(12vw * .9)}
  .nums .top,.about .in,.ph-hero .sub,.tx2,.steps,.nextp .row{grid-template-columns:minmax(0,1fr)}
  .ph-hero .meta{justify-self:start;text-align:left}
  .pstage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start;padding-top:96px;gap:24px}
  .pmedia{height:52svh}
  .pdesc{min-height:6.4em}
  .figs{grid-template-columns:repeat(2,minmax(0,1fr));padding-block:80px}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}

const lines = (txt, n) => { const w = txt.split(' '); if (w.length === 1) return [txt]; const k = Math.ceil(w.length / n); const out = []; for (let i = 0; i < w.length; i += k) out.push(w.slice(i, i + k).join(' ')); return out; };
const masked = (ls, cls = '') => ls.map((l, i) => `<span class="mask ${cls}${i ? ' l2' : ''}"><span>${esc(l)}</span></span>`).join('');
const chars = t => [...t].map(c => c === ' ' ? ' ' : `<span class="ch">${esc(c)}</span>`).join('');

/* Titulares: cada línea cabe siempre en su ancho con la fuente real.
   .fill ocupa el ancho exacto; .fit solo se reduce si no cabe; el resto de titulares se reduce si una palabra desborda. */
function fitText() {
  document.querySelectorAll('.fit,.fill').forEach(el => {
    el.style.fontSize = '';
    const cs = getComputedStyle(el), avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (!avail) return;
    const d0 = el.style.display, w0 = el.style.width;
    el.style.display = 'inline-block'; el.style.width = 'auto';
    const tw = el.offsetWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    el.style.display = d0; el.style.width = w0;
    const fs = parseFloat(cs.fontSize);
    if (el.classList.contains('fill')) el.style.fontSize = Math.min(fs * avail / tw * .995, innerHeight * .3) + 'px';
    else if (tw > avail) el.style.fontSize = fs * avail / tw * .99 + 'px';
    for (let k = 0; k < 4; k++) { const r = el.scrollWidth / el.clientWidth; if (!(r > 1.002)) break; el.style.fontSize = parseFloat(el.style.fontSize || cs.fontSize) / r * .99 + 'px'; }
  });
  document.querySelectorAll('.wide:not(.fit):not(.fill), .prow .t, .tile .t, .figs .n').forEach(el => {
    el.style.fontSize = '';
    for (let k = 0; k < 4; k++) {
      const boxes = [el, ...el.querySelectorAll('.mask')];
      const r = Math.max(...boxes.map(b => b.clientWidth ? b.scrollWidth / b.clientWidth : 1));
      if (r <= 1.005) break;
      el.style.fontSize = parseFloat(getComputedStyle(el).fontSize) / r * .98 + 'px';
    }
  });
}

/* Desplazamiento suave */
let lenis = null;
if (!reduce && typeof Lenis !== 'undefined') {
  lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 1, smoothWheel: true });
  if (hasG) { lenis.on('scroll', ScrollTrigger.update); gsap.ticker.add(t => lenis.raf(t * 1000)); gsap.ticker.lagSmoothing(0); }
  else { const r = t => { lenis.raf(t); requestAnimationFrame(r); }; requestAnimationFrame(r); }
}
const goTop = () => { if (lenis) lenis.scrollTo(0, { immediate: true }); else window.scrollTo(0, 0); };
/* Salto a una sección al llegar desde otra página: la posición se calcula cuando las escenas fijadas ya
   han medido su recorrido, y se vuelve a ajustar si la página cambia de alto (fuentes, imágenes) poco después */
let pendingAnchor = null, pendingUntil = 0;
const jumpTo = el => {
  if (hasG) ScrollTrigger.refresh();
  if (lenis) { lenis.resize(); lenis.scrollTo(el, { immediate: true, force: true }); }
  else window.scrollTo(0, el.getBoundingClientRect().top + scrollY);
};
const goTo = el => { if (lenis) lenis.scrollTo(el, { offset: 0, duration: 1.4 }); else el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); };

/* ---------- Portada ---------- */
const IMG = s => 'img/' + s;
/* Imagen de cada proyecto en el índice de la portada (true = dibujo sobre blanco) */
const TILE = { 'belug-04': [IMG('belug-04-02.jpg')], 'mecanismo-dosificador': [IMG('qiub-01.jpg')], 'ovum-g1': [IMG('ovum-g1-02.jpg')],
  'bmw-m6-concept': [IMG('bmw-m6-concept-02.jpg')], 'mies': [IMG('mies-01.jpg'), true], 'ingenieria-inversa': [IMG('ingenieria-inversa-01.jpg')] };
/* Enlaces: en la web publicada cada proyecto tiene su URL; en la vista previa se usan anclas */
const PH = s => PATHS ? '/proyectos/' + s : '#p-' + s;
const AH = id => PATHS ? '/#' + id : '#' + id;
const STAGES = [

    </div>
    <div class="pmedia" id="pmedia">

<section class="about" id="sobre-mi" aria-labelledby="ab-h">

</footer>`;
}

/* ---------- Proyecto ---------- */
function fig(it, cls = '') {
  return `<figure class="fig ${cls}"><div class="bx ${it.kind && it.kind !== 'photo' ? 'wh' : ''}" data-zoom="${esc(it.src)}" data-cap="${esc(it.cap || '')}" role="button" tabindex="0" aria-label="Ampliar: ${esc(it.cap || 'imagen')}"><img class="par" src="${esc(it.src)}" alt="${esc(it.cap || '')}" width="${it.w}" height="${it.h}" loading="lazy" decoding="async"></div>${it.cap ? `<figcaption>${esc(it.cap)}</figcaption>` : ''}</figure>`;
}
function block(b) {
  if (b.type === 'text') {
    const body = b.body.map(t => `<p>${esc(t)}</p>`).join('') + (b.specs && b.specs.length ? `<div class="specs">${b.specs.map(([k, v]) => `<p><b>${esc(k)}</b>${esc(v)}</p>`).join('')}</div>` : '') + (b.aside ? fig(b.aside) : '');
    return `<section class="wrap blk"><div class="tx2"><h2 class="wide rvh">${esc(b.title)}</h2><div class="body rv">${body}</div></div></section>`;
  }
  if (b.type === 'images') {
    const draw = b.items.every(it => it.kind !== 'photo');
    const cols = { pair: 'g2', 'pair-tall': 'g2', trio: 'g3', quad: 'g2' }[b.layout] || 'g2';
    const inner = b.layout === 'full' ? fig(b.items[0], 'full') : `<div class="grid ${cols}">${b.items.map(it => fig(it)).join('')}</div>`;
    return draw ? `<section class="drawband"><div class="wrap">${inner}</div></section>` : `<section class="wrap blk">${inner}</section>`;
  }
  if (b.type === 'table') return `<section class="wrap blk"><div class="tx2"><h2 class="wide rvh">${esc(b.title)}</h2><div class="body rv"><div class="tblw"><table><thead><tr>${b.head.map(h => `<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${b.note ? `<p style="font-size:15px;color:var(--ink-2)">${esc(b.note)}</p>` : ''}</div></div></section>`;
  if (b.type === 'steps') return `<section class="wrap blk"><div class="steps"><div style="display:flex;flex-direction:column;gap:32px"><h2 class="wide rvh" style="font-size:clamp(40px,4.6vw,84px)">${esc(b.title)}</h2><ol class="rv">${b.items.map(t => `<li><span>${esc(t)}</span></li>`).join('')}</ol></div>${fig(b.image)}</div></section>`;
  return '';
}
function project(p) {
  const i = P.indexOf(p), nx = P[(i + 1) % P.length];
  const nm = short(p.name), sub = p.name.split(' · ')[1];
  const meta = (sub ? [sub] : []).concat(p.meta);
  const vis = p.model
    ? `<div class="pvis m3"><p class="ghost wide fit" aria-hidden="true">${esc(nm)}</p><model-viewer id="mvP" src="${esc(p.model.cycle && !reduce ? p.model.cycle : p.model.src)}" alt="" aria-hidden="true" camera-orbit="${esc(p.model.orbit)}" environment-image="neutral" exposure="0.95" shadow-intensity="0.8" shadow-softness="0.9" interaction-prompt="none" disable-zoom loading="eager"></model-viewer>
       <div class="hint"><span>${p.model.cycle ? 'Baja para verlo en movimiento' : 'Baja para rodearlo'}</span></div></div>
     <section class="viewer" aria-labelledby="vw-h">
       <div class="wrap vtop"><h2 id="vw-h" class="wide rvh">Explóralo</h2><p class="rv">Arrastra para girar · pellizca o usa + y − para acercar</p></div>
       ${p.model.comps ? `<div class="wrap vcomp" role="group" aria-label="Composiciones">${p.model.comps.map(([t, f, r], k) => `<button type="button" data-src="${esc(f)}" data-r="${r}" aria-pressed="${k ? 'false' : 'true'}">${esc(t)}</button>`).join('')}</div>` : ''}
       <div class="vbox"><model-viewer id="mvV" src="${esc(p.model.src)}" alt="Modelo 3D de ${esc(nm)}, interactivo" camera-controls touch-action="pan-y" disable-pan camera-orbit="${esc(p.model.orbit)}" min-camera-orbit="auto 8deg auto" max-camera-orbit="auto 172deg auto" environment-image="neutral" exposure="0.95" shadow-intensity="0.8" shadow-softness="0.9" interaction-prompt="auto" loading="lazy"></model-viewer>
         <div class="vbtn"><button type="button" data-z="1" aria-label="Acercar">+</button><button type="button" data-z="-1" aria-label="Alejar">−</button><button type="button" data-z="0" class="txt">Centrar</button></div></div>
     </section>`
    : `<div class="pvis"><img class="pimg" src="${esc(p.hero.src)}" alt="${esc(nm)}" data-zoom="${esc(p.hero.src)}"></div>`;
  const figs = p.figures && p.figures.length ? `<section class="wrap figs">${p.figures.map(([n, l]) => `<div class="rv"><span class="n" data-count="${esc(n)}">${esc(n)}</span><span class="l">${esc(l)}</span></div>`).join('')}</section>` : '';
  return `

  <a class="back" href="${AH('proyectos')}"><span aria-hidden="true">←</span> Todos los proyectos</a>
  <h1 class="wide" aria-label="${esc(nm)}">${masked(lines(nm, nm.split(' ').length > 1 ? 2 : 1), 'fit')}</h1>

</a>` + endBlock();
}

/* ---------- Animación ---------- */
function splitWords(el) { el.innerHTML = el.textContent.split(/\s+/).map(w => `<span class="w">${esc(w)}</span>`).join(' '); return [...el.querySelectorAll('.w')]; }
function common() {
  if (!hasG || reduce) return;
  gsap.utils.toArray('.rvh').forEach(h => {
    if (!h.querySelector('.mask')) { const t = h.textContent; h.innerHTML = `<span class="mask"><span>${esc(t)}</span></span>`; }
    gsap.from(h.querySelectorAll('.mask>span'), { yPercent: 115, duration: 1.3, ease: 'expo.out', scrollTrigger: { trigger: h, start: 'top 88%' } });
  });
  gsap.utils.toArray('.rv').forEach(el => gsap.from(el, { y: 36, opacity: 0, duration: 1.1, ease: 'expo.out', scrollTrigger: { trigger: el, start: 'top 90%' } }));
  const big = document.getElementById('bigname');
  if (big) gsap.fromTo(big.firstElementChild, { yPercent: 100 }, { yPercent: 0, ease: 'none', scrollTrigger: { trigger: big, start: 'top bottom', end: 'bottom bottom', scrub: true } });
}
function homeAnim() {
  if (!hasG || reduce) return;
  const hh = document.getElementById('hh'), chs = hh.querySelectorAll('.ch');
  gsap.from(chs, { yPercent: 115, rotate: 6, duration: 1.3, ease: 'expo.out', stagger: .035, delay: .15 });
  // al bajar, las dos líneas se deslizan en sentidos contrarios
  const hs = { trigger: '.hero', start: 'top top', end: 'bottom top', scrub: .7 };
  gsap.to('.hero .cue', { autoAlpha: 0, ease: 'none', scrollTrigger: { ...hs, end: '15% top' } });
  gsap.to('.hero h1 .mask:first-child>span', { xPercent: -16, ease: 'none', scrollTrigger: hs });
  gsap.to('.hero h1 .l2>span', { xPercent: 12, ease: 'none', scrollTrigger: hs });

  // Proceso: escena fijada con cuatro mesas
  const stage = document.getElementById('pstage'), reel = document.getElementById('preel');
  const layers = [...stage.querySelectorAll('.layer')], descs = [...stage.querySelectorAll('.pdesc p')], model = document.getElementById('pmodel');
  const N = layers.length;
  layers.forEach((l, i) => gsap.set(l, { clipPath: i ? 'inset(100% 0% 0% 0%)' : 'inset(0% 0% 0% 0%)', autoAlpha: i ? 0 : 1 }));
  descs.forEach((d, i) => gsap.set(d, { opacity: i ? 0 : 1, y: i ? 24 : 0 }));
  const tl = gsap.timeline({ defaults: { ease: 'none' }, scrollTrigger: { trigger: stage, start: 'top top', end: () => '+=' + innerHeight * 2.4, pin: true, scrub: 0.8, anticipatePin: 1 } });
  layers.forEach((l, i) => {
    const its = l.querySelectorAll('.it');
